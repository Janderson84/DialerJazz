name: Binary sync helper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all | fav | logo"
        required: false
        default: "all"
jobs:
  sync:
    if: github.repository == 'Janderson84/DialerJazz'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ github.token }}

      - name: Download and commit binary files
        run: |
          set -euo pipefail
          mode="${{ inputs.mode }}"
          if [ "$mode" = "all" ] || [ "$mode" = "fav" ]; then
            curl -sSL --max-time 120 -o client/public/favicon-256.png https://files.catbox.moe/vcxpjd.png
            echo "fav md5: $(md5sum client/public/favicon-256.png | cut -d' ' -f1)"
          fi
          if [ "$mode" = "all" ] || [ "$mode" = "logo" ]; then
            curl -sSL --max-time 180 -o client/public/logo.png https://files.catbox.moe/pymw44.png
            echo "logo md5: $(md5sum client/public/logo.png | cut -d' ' -f1)"
          fi
          if [ -n "$(git status --porcelain -- client/public/)" ]; then
            git config user.name "Janderson84"
            git config user.email "Janderson84@users.noreply.github.com"
            git add client/public/favicon-256.png client/public/logo.png
            git commit -m "Update favicon-256.png and logo.png (binary sync)"
            git push origin HEAD:main
          else
            echo "No binary changes detected."
          fi
